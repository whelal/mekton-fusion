<form class="flexcol">
  <header class="sheet-header flexrow">
    <h1><input name="name" type="text" value="{{item.name}}" placeholder="Item Name"/></h1>
  </header>

  <section class="sheet-body">

    {{#if isSkill}}
      <div class="form-group">
        <label>Stat</label>
        {{#if isCustom}}
          <select name="system.stat">
            <option value="INT">INT</option>
            <option value="REF">REF</option>
            <option value="TECH">TECH</option>
            <option value="COOL">COOL</option>
            <option value="ATTR">ATTR</option>
            <option value="LUCK">LUCK</option>
            <option value="MA">MA</option>
            <option value="BODY">BODY</option>
            <option value="EMP">EMP</option>
          </select>
        {{else}}
          <input type="text" value="{{system.stat}}" readonly style="background: #f0f0f0;"/>
          <small style="color: #666; font-style: italic;">Default skills use fixed stats. Only custom skills can be edited.</small>
        {{/if}}
      </div>
    {{/if}}

    {{#if isWeapon}}
      <div class="form-group">
        <label>WA</label>
        <input type="number" name="system.wa" value="{{system.wa}}"/>
      </div>
      <div class="form-group">
        <label>Range</label>
        <input type="text" name="system.range" value="{{system.range}}" placeholder="e.g. 28-400, T, 1"/>
      </div>
      <div class="form-group">
        <label>Damage</label>
        <input type="text" name="system.damage" value="{{system.damage}}" placeholder="e.g. 4D6, 3D6+"/>
      </div>
      <div class="form-group">
        <label>Damage Note</label>
        <input type="text" name="system.damageNote" value="{{system.damageNote}}" placeholder="e.g. [AP], *"/>
      </div>
      <div class="form-group">
        <label>Shots</label>
        <input type="text" name="system.shots" value="{{system.shots}}" placeholder="e.g. 50, na, 10 turns"/>
      </div>
      <div class="form-group">
        <label>BV</label>
        <input type="text" name="system.bv" value="{{system.bv}}" placeholder="e.g. 5, na, (2)"/>
      </div>
      <div class="form-group">
        <label>Skill</label>
        <input type="text" name="system.skill" value="{{system.skill}}" placeholder="e.g. rifle, blade, archery"/>
      </div>
      <div class="form-group">
        <label>Concealability</label>
        <input type="text" name="system.conc" value="{{system.conc}}" placeholder="P/J/L/N"/>
      </div>
      <div class="form-group">
        <label>Weight (kg)</label>
        <input type="number" name="system.weight" value="{{system.weight}}" min="0" step="0.01"/>
      </div>
      <div class="form-group">
        <label>Cost</label>
        <input type="number" name="system.cost" value="{{system.cost}}" min="0"/>
      </div>
      <div class="form-group">
        <label>Ammo Cost (per clip)</label>
        <input type="number" name="system.ammoCost" value="{{system.ammoCost}}" min="0" step="0.5"/>
      </div>
      <div class="form-group">
        <label>TL</label>
        <input type="number" name="system.tl" value="{{system.tl}}" min="0"/>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <input type="text" name="system.note" value="{{system.note}}"/>
      </div>
      <div class="form-group">
        <label>Mecha Weapon</label>
        <input type="checkbox" name="system.isMecha" {{#if system.isMecha}}checked{{/if}}/>
      </div>
    {{/if}}
  </section>
</form>
